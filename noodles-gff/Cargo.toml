[package]
name = "noodles-gff"
version = "0.51.0"
authors = ["Michael Macias <zaeleus@gmail.com>"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Generic Feature Format (GFF) reader and writer"
homepage = "https://github.com/zaeleus/noodles"
repository = "https://github.com/zaeleus/noodles"
documentation = "https://docs.rs/noodles-gff"
categories = ["parser-implementations", "science::bioinformatics"]

[features]
async = ["dep:futures", "dep:tokio"]

[dependencies]
bstr.workspace = true
indexmap.workspace = true
lexical-core.workspace = true
log.workspace = true
memchr.workspace = true
noodles-bgzf = { path = "../noodles-bgzf", version = "0.42.0" }
noodles-core = { path = "../noodles-core", version = "0.18.0" }
noodles-csi = { path = "../noodles-csi", version = "0.50.0" }
percent-encoding.workspace = true

futures = { workspace = true, optional = true, features = ["std"] }
tokio = { workspace = true, optional = true, features = ["io-util"] }

[dev-dependencies]
flate2.workspace = true
futures.workspace = true
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "io-util"] }

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["async"]

[[bench]]
name = "fast_vs_original"
harness = false

[[bench]]
name = "ultimate_benchmark"
harness = false

[[bench]]
name = "async_benchmark"
harness = false


[[example]]
name = "gff_count_async"
required-features = ["async"]

[[example]]
name = "async_recordbuf_test"
required-features = ["async"]
